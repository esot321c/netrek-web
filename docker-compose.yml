services:
  netrek-postgres:
    image: postgres:18-alpine
    container_name: netrek-postgres${CONTAINER_SUFFIX:-}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netrek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-netrek}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - netrek-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-netrek} -d ${POSTGRES_DB:-netrek}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  netrek-redis:
    image: redis:7-alpine
    container_name: netrek-redis${CONTAINER_SUFFIX:-}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - netrek-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  netrek-network:
    name: netrek-network${CONTAINER_SUFFIX:-}
    driver: bridge
